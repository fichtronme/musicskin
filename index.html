<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Music player</title>
<link rel="preconnect" href="https://itunes.apple.com" crossorigin>
<link rel="preconnect" href="https://is1-ssl.mzstatic.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Anton&family=Cormorant+Garamond:ital,wght@1,700&family=Fraunces:ital,wght@1,700&family=Righteous&display=swap">
<style>
:root{--text:#fff;--dim:rgba(255,255,255,.68);--accent:#e8eaee}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:Onest,system-ui,sans-serif;color:var(--text);background:#0c0d0f;overflow-x:hidden}
#blobs{position:fixed;inset:0;z-index:-3;overflow:hidden}
#blobs i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(70px);opacity:.4;animation:drift 22s ease-in-out infinite alternate}
#blobs i:nth-child(1){background:#9097a3;left:-15vmax;top:-10vmax}
#blobs i:nth-child(2){background:#4b515c;right:-20vmax;top:10vmax;animation-delay:-7s}
#blobs i:nth-child(3){background:#c3c7cf;left:20vmax;bottom:-30vmax;animation-delay:-13s}
@keyframes drift{to{transform:translate(9vmax,-7vmax) scale(1.25)}}
#bg{position:fixed;inset:-40px;z-index:-2;background:center/cover;opacity:0;filter:blur(36px) grayscale(1) brightness(.45);transition:opacity 1s}
#bg.on{opacity:1}

.panel{--d:1;transform:translate3d(calc(var(--px,0) * var(--d) * .6px),calc(var(--py,0) * var(--d) * .6px),0) rotateX(calc(var(--py,0) * -.24deg)) rotateY(calc(var(--px,0) * .24deg));position:relative;border-radius:30px;isolation:isolate;
  background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.015) 45%,rgba(255,255,255,.04)),rgba(10,11,13,.5);
  backdrop-filter:blur(16px) saturate(120%) brightness(.8);-webkit-backdrop-filter:blur(16px) saturate(120%) brightness(.8);
  box-shadow:inset 1.5px 1.5px 1px -.5px rgba(255,255,255,.4),inset -1.5px -1.5px 1px -.5px rgba(255,255,255,.15),inset 0 0 28px rgba(255,255,255,.03),0 18px 40px rgba(0,0,0,.3),0 2px 6px rgba(0,0,0,.2);
  animation:rise .9s cubic-bezier(.2,.9,.3,1) both}
.panel::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(260px circle at var(--mx,30%) var(--my,0%),rgba(255,255,255,.12),transparent 60%);mix-blend-mode:overlay}
header.panel{animation-delay:0s;--d:.5}aside.panel{--d:1.4}#stage{animation-delay:.12s}aside{animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97);filter:blur(8px)}}

main{max-width:1320px;margin:0 auto;padding:24px;height:100vh;perspective:1600px;grid-template-rows:auto auto minmax(0,1fr);display:grid;gap:20px 0;grid-template-columns:minmax(0,1.15fr) minmax(0,0fr) minmax(0,1fr) 200px;transition:grid-template-columns .75s cubic-bezier(.2,.9,.3,1)}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 20px;border-radius:999px}
h1{font-size:1.15rem;font-weight:700;margin-right:auto;letter-spacing:-.01em}
input[type=text]{font:inherit;font-size:.92rem;color:var(--text);background:rgba(255,255,255,.05);border:0;border-radius:999px;padding:10px 18px;min-width:0;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.28),inset 0 -1px 0 rgba(255,255,255,.3)}
input::placeholder{color:var(--dim)}
button{font:inherit;font-size:.92rem;font-weight:600;color:var(--text);cursor:pointer;border:0;border-radius:999px;padding:10px 20px;
  background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.05));
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(255,255,255,.2),0 6px 14px rgba(0,0,0,.25);
  transition:transform .3s cubic-bezier(.3,1.7,.5,1),background .2s}
button:hover{transform:scale(1.07)}
button:active{transform:scale(.93)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button.primary{color:#1b1d22;background:linear-gradient(180deg,#f6f7f9,#c5c9d0);box-shadow:inset 0 1.5px 0 #fff,0 6px 20px rgba(225,228,234,.4)}
#status{grid-column:1/-1;justify-self:start;padding:9px 20px;font-size:.9rem;display:flex;gap:10px;align-items:center;border-radius:999px;animation-delay:.06s}
#status::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;animation:pulse 2s ease-in-out infinite}
#status.err{color:#ffd7d7}#status.err::before{background:#ff6b6b}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(232,234,238,0);transform:scale(.8)}0%{box-shadow:0 0 0 0 rgba(232,234,238,.6)}}
#stage{padding:16px;display:flex;flex-direction:column;justify-content:center;gap:16px;min-height:0}
#video{flex:none;aspect-ratio:16/9;min-width:200px;min-height:200px;border-radius:22px;overflow:hidden;background:#000;box-shadow:0 12px 30px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.28)}
#video iframe{width:100%;height:100%;display:block}
#title{font-size:1.5rem;font-weight:700;line-height:1.15;letter-spacing:-.01em}
#by{color:var(--dim);margin-top:4px}
.meta{text-align:center}
#art{position:relative;width:clamp(150px,calc(100vh - 510px),360px);max-width:100%;aspect-ratio:1;margin:0 auto;flex:none;border-radius:26px;isolation:isolate;box-shadow:0 0 0 1px rgba(255,255,255,.3),0 20px 50px rgba(0,0,0,.4)}
#art::before{content:"";position:absolute;inset:8%;z-index:-1;border-radius:50%;background:var(--cover) center/cover;filter:blur(36px) saturate(1.2);opacity:.8;transition:opacity .8s}
#artbox{width:100%;height:100%;border-radius:inherit;overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.05))}
#cover{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transform:scale(1.06);transition:opacity .7s,transform .9s cubic-bezier(.2,.9,.3,1)}
#cover.on{opacity:1;transform:none}
#cover.lb{transform:scale(1.4)}
#cover.lb.on{transform:scale(1.34)}
.playing #art{animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) scale(1.015)}}
.bar{display:flex;align-items:center;gap:12px;font-size:.82rem;color:var(--dim);font-variant-numeric:tabular-nums}
.seekwrap{flex:1;position:relative;height:8px;border-radius:99px;background:rgba(255,255,255,.1);box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
#fill{position:absolute;left:0;top:0;height:100%;border-radius:99px;width:calc(11px + (100% - 22px) * var(--p,0) / 100);pointer-events:none;transition:width .5s linear;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent) no-repeat,linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.55) 70%,rgba(255,255,255,.95));
  background-size:30% 100%,100% 100%;background-position:-40% 0,0 0;box-shadow:0 0 14px rgba(255,255,255,.28)}
.playing #fill{animation:sweep 1.8s linear infinite}
@keyframes sweep{to{background-position:140% 0,0 0}}
#seek{position:absolute;left:0;top:50%;transform:translateY(-50%);width:100%;height:22px;margin:0;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}
#seek::-webkit-slider-runnable-track{height:22px;background:transparent}
#seek::-moz-range-track{height:22px;background:transparent}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;border:0;background:linear-gradient(180deg,#fff,#cfd6ee);box-shadow:inset 0 1px 0 #fff,0 3px 10px rgba(0,0,0,.4);transition:transform .2s cubic-bezier(.3,1.7,.5,1)}
#seek::-webkit-slider-thumb:hover{transform:scale(1.25)}
#seek::-moz-range-thumb{width:22px;height:22px;border-radius:50%;border:0;background:#e8ecfa;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.ctl{display:flex;gap:16px;justify-content:center;align-items:center}
.ctl button{width:54px;height:54px;padding:0;font-size:1.1rem}
.ctl .primary{width:74px;height:74px;font-size:1.5rem}
.playing .ctl .primary{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:inset 0 1.5px 0 #fff,0 6px 34px rgba(235,238,244,.8)}}
aside{padding:16px;display:flex;flex-direction:column;gap:12px;min-height:0}
.qhead{display:flex;align-items:baseline;justify-content:space-between;padding:6px 10px 0}
.qhead h2{font-size:1.15rem;font-weight:700;letter-spacing:-.01em}
#count{font-size:.82rem;color:var(--dim)}
#lists{display:flex;flex-direction:column;gap:6px;overflow-y:auto;overflow-x:hidden;padding:2px 2px 2px 2px;flex:1;min-height:0}
/* Custom scrollbar: slim glass pill that brightens on hover */
#tracks::-webkit-scrollbar,#lists::-webkit-scrollbar{width:14px;height:0}
#tracks::-webkit-scrollbar-track,#lists::-webkit-scrollbar-track{background:transparent;margin:6px 0}
#tracks::-webkit-scrollbar-corner,#lists::-webkit-scrollbar-corner{background:transparent}
#tracks::-webkit-scrollbar-thumb,#lists::-webkit-scrollbar-thumb{background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.16));border:4px solid transparent;background-clip:padding-box;border-radius:99px;transition:background .2s}
#tracks:not(:hover)::-webkit-scrollbar-thumb,#lists:not(:hover)::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);background-clip:padding-box}
#tracks::-webkit-scrollbar-thumb:hover,#tracks::-webkit-scrollbar-thumb:active,#lists::-webkit-scrollbar-thumb:hover,#lists::-webkit-scrollbar-thumb:active{background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,.4));background-clip:padding-box}
@supports not selector(::-webkit-scrollbar){#tracks,#lists{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.3) transparent}}
#lists button{flex:1 1 0;min-height:30px;max-height:44px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 14px;font-size:.78rem}
#lists button:hover{transform:scale(1.03)}
#lists button.on{color:#1b1d22;background:linear-gradient(180deg,#f6f7f9,#c5c9d0)}
#tracks{list-style:none;--pad:6px;padding:var(--pad) 12px var(--pad) 8px;scroll-padding:var(--pad) 0;overflow-y:auto;overflow-x:hidden;flex:1;min-height:0;scroll-snap-type:y mandatory}
#tracks li{scroll-snap-align:start}
#tracks li{display:flex;flex-direction:column;padding:5px 12px;border-radius:14px;cursor:pointer;transition:background .25s,transform .3s cubic-bezier(.3,1.5,.5,1);animation:rise .5s both}
#tracks li:hover{background:rgba(255,255,255,.07)}
#tracks li.on{background:rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
#tracks b{font-weight:600;font-size:.8rem;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tracks li.on b::before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:var(--accent);animation:dotp 1.6s ease-in-out infinite}
@keyframes dotp{50%{opacity:.35;transform:scale(.7)}}
#tracks li.empty{display:block;padding:11px 16px}
#tracks span{font-size:.68rem;line-height:1.3;color:var(--dim)}
.bad{opacity:.45}
.empty{color:var(--dim);cursor:default!important;font-size:.9rem}
/* Search mode: makes it obvious the songs are search results */
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes spin{to{--ang:360deg}}
@keyframes swap{from{opacity:0;transform:translateY(-12px);filter:blur(6px)}}
@keyframes found{from{opacity:0;transform:translateX(44px) scale(.94);filter:blur(6px)}}
@keyframes chip{from{opacity:0;transform:scale(.6) translateY(-8px)}}
#songtitle.swap{animation:swap .5s cubic-bezier(.2,1.2,.4,1) both}
#songpanel::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:2px;opacity:0;transition:opacity .5s;
  background:conic-gradient(from var(--ang),transparent 0 55%,rgba(255,255,255,.95) 80%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
body.searching #songpanel::before,body.sloading #songpanel::before{opacity:1;animation:spin 3.5s linear infinite}
#songpanel{transition:box-shadow .6s}
body.searching #songpanel{box-shadow:inset 1.5px 1.5px 1px -.5px rgba(255,255,255,.5),inset -1.5px -1.5px 1px -.5px rgba(255,255,255,.2),inset 0 0 46px rgba(255,255,255,.08),0 18px 40px rgba(0,0,0,.3),0 0 46px rgba(215,225,255,.2)}
#tracks{transition:opacity .3s,filter .3s}
body.sloading #tracks{opacity:.3;filter:blur(3px)}
body.searching #tracks li{animation:found .55s cubic-bezier(.2,1.2,.4,1) both}
#listpanel{transition:opacity .5s,filter .5s}
body.searching #listpanel,body.sloading #listpanel{opacity:.45;filter:saturate(.5)}
#schip{align-self:flex-start;display:flex;align-items:center;gap:8px;max-width:100%;margin:-2px 6px 0;padding:5px 6px 5px 14px;border-radius:999px;font-size:.8rem;font-weight:600;
  background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.06));box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),0 4px 12px rgba(0,0,0,.25);animation:chip .5s cubic-bezier(.2,1.4,.4,1) both}
#schip[hidden]{display:none}
#sq{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sclear{flex:none;width:22px;height:22px;padding:0;font-size:.65rem;display:grid;place-items:center}
@media(prefers-reduced-motion:reduce){body.searching #tracks li,#songtitle.swap,#schip,body.searching #songpanel::before{animation:none!important}}

/* Song suggestions under the search bar */
@keyframes sugin{from{opacity:0;transform:translateY(-12px) scale(.97);filter:blur(8px)}}
@keyframes sgin{from{opacity:0;transform:translateY(-10px)}}
#sug{position:absolute;top:calc(100% + 10px);z-index:40;padding:10px;border-radius:30px;transform-origin:top center;
  background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.03) 45%,rgba(255,255,255,.07)),rgba(14,15,18,.5);
  backdrop-filter:blur(30px) saturate(180%) brightness(.85);-webkit-backdrop-filter:blur(30px) saturate(180%) brightness(.85);
  box-shadow:inset 2px 2px 1px -.5px rgba(255,255,255,.55),inset -2px -2px 1px -.5px rgba(255,255,255,.22),inset 0 0 40px rgba(255,255,255,.05),0 26px 60px rgba(0,0,0,.45);
  animation:sugin .4s cubic-bezier(.2,1.3,.4,1) both}
#sug[hidden]{display:none}
#sug h4{font-size:.68rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:6px 14px 8px}
.sg{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;border-radius:22px;cursor:pointer;animation:sgin .25s cubic-bezier(.2,1.2,.4,1) both;animation-delay:calc(var(--i) * 20ms);transition:background .2s,transform .3s cubic-bezier(.3,1.5,.5,1)}
.sg:hover,.sg.on{background:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.35);transform:translateX(3px)}
.sg img,.sg .ico{width:44px;height:44px;border-radius:14px;flex:none;object-fit:cover;background:rgba(255,255,255,.1);box-shadow:0 4px 12px rgba(0,0,0,.4)}
.sg img{opacity:0;transition:opacity .25s}
.sg img.ld{opacity:1}
#sug.still .sg{animation:none}
.sg .ico{display:grid;place-items:center;font-size:1.1rem}
.sg .tx{min-width:0;flex:1}
.sg b{display:block;font-size:.92rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg b mark{background:none;color:#fff;text-shadow:0 0 14px rgba(255,255,255,.7);text-decoration:underline;text-decoration-color:rgba(255,255,255,.35);text-underline-offset:3px}
.sg span{display:block;font-size:.78rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg kbd{flex:none;font:inherit;font-size:.7rem;color:var(--dim);padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.07);opacity:0;transition:opacity .2s}
.sg:hover kbd,.sg.on kbd{opacity:1}
@media(prefers-reduced-motion:reduce){#sug,.sg{animation:none}}

/* Top bar: account on the left, song search on the right */
#topbar{grid-column:1/-1;display:flex;gap:20px;align-items:stretch;position:relative;z-index:30}
#topbar header{flex:0 0 auto;flex-wrap:nowrap}
#topbar h1{margin-right:12px;white-space:nowrap}
#sbar{--d:.5;flex:1 1 0;min-width:0;display:flex;gap:10px;align-items:center;padding:14px 20px;border-radius:999px;animation-delay:.05s}
#sbar .sfield{flex:1;min-width:0;position:relative;display:flex}
#sbar input{flex:1;min-width:0;width:100%;padding-right:44px}
#sclr{position:absolute;right:9px;top:0;bottom:0;margin:auto 0;width:26px;height:26px;padding:0;display:grid;place-items:center;font-size:.72rem;line-height:1;border-radius:50%;color:var(--dim);background:rgba(255,255,255,.1);box-shadow:none}
#sclr[hidden]{display:none}
#sclr:hover{color:var(--text);background:rgba(255,255,255,.2)}

/* Playlists as a 3D cylinder: the selected one sticks out toward you */
#lists{position:relative;perspective:900px;margin:-12px -14px;padding:26px 24px}
#lists button{--z:0px;--o:1;opacity:var(--o);transform:translateZ(var(--z));transform-origin:center;
  transition:transform .22s ease-out,opacity .22s,background .2s,box-shadow .4s}
#lists button:hover{transform:translateZ(calc(var(--z) + 8px))}
#lists button:active{transform:translateZ(var(--z)) scale(.96)}
#lists button.on{box-shadow:inset 0 1.5px 0 #fff,0 8px 18px -4px rgba(0,0,0,.5),0 0 20px rgba(235,238,244,.28)}
#lists button:not(.on){background:rgba(255,255,255,.035);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);color:rgba(255,255,255,.72)}
#lists button:not(.on):hover{background:rgba(255,255,255,.08);color:#fff}

/* "Syncing" pill shown while the lyrics catch up after a skip */
@keyframes lspin{to{transform:rotate(360deg)}}
@keyframes lshim{to{transform:translateX(100%)}}
@keyframes ldots{to{width:1.15em}}
#lyrics{transition:filter .4s,opacity .4s}
body.lsync #lyrics{filter:blur(2.5px);opacity:.5}
body.lsync.lload #lyrics{filter:none;opacity:1}
#lsync{position:absolute;left:50%;bottom:24px;transform:translate(-50%,18px) scale(.9);display:flex;align-items:center;gap:10px;padding:9px 20px 9px 16px;border-radius:999px;overflow:hidden;
  font-size:.85rem;font-weight:600;letter-spacing:.05em;color:#fff;opacity:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.08));backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.65),inset 0 -1px 0 rgba(255,255,255,.15),0 10px 28px rgba(0,0,0,.4),0 0 30px rgba(220,228,255,.18);
  transition:opacity .35s,transform .55s cubic-bezier(.2,1.3,.4,1)}
body.lsync #lsync{opacity:1;transform:translate(-50%,0) scale(1)}
#lsync::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.4) 50%,transparent 70%);transform:translateX(-100%);animation:lshim 1.5s ease-in-out infinite}
#lsync i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;animation:lspin .8s linear infinite}
#lsync span::after{content:"...";display:inline-block;width:0;overflow:hidden;vertical-align:bottom;animation:ldots 1.2s steps(4) infinite}
@media(prefers-reduced-motion:reduce){#lsync::after,#lsync i,#lsync span::after{animation:none!important}}

/* Lyrics button */
.ctl .lyrbtn{width:auto;height:auto;padding:10px 24px;font-size:.9rem}
.ctl .lyrbtn.on{color:#1b1d22;background:linear-gradient(180deg,#f6f7f9,#c5c9d0);box-shadow:inset 0 1.5px 0 #fff,0 6px 20px rgba(225,228,234,.4)}

/* Grid placement (lets the panels slide aside when lyrics open) */
#stage{grid-column:1;grid-row:3;margin-right:20px}
#songpanel{grid-column:3;grid-row:3;margin-right:20px}
#listpanel{grid-column:4;grid-row:3}

/* Lyrics panel: liquid glass */
#lyricspanel{grid-column:2;grid-row:3;min-width:0;display:flex;flex-direction:column;padding:16px 0 0;overflow:hidden;animation:none;
  opacity:0;visibility:hidden;pointer-events:none;transition:opacity .45s,visibility 0s .75s,margin .75s cubic-bezier(.2,.9,.3,1);
  background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.02) 40%,rgba(255,255,255,.07)),rgba(14,15,18,.36);
  backdrop-filter:blur(28px) saturate(180%) brightness(.85);-webkit-backdrop-filter:blur(28px) saturate(180%) brightness(.85);
  box-shadow:inset 2px 2px 1px -.5px rgba(255,255,255,.6),inset -2px -2px 1px -.5px rgba(255,255,255,.28),inset 0 0 44px rgba(255,255,255,.06),inset 0 0 0 1px rgba(255,255,255,.05),0 26px 64px rgba(0,0,0,.4),0 2px 8px rgba(0,0,0,.25)}
#lyricspanel::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:linear-gradient(115deg,rgba(255,255,255,.16),transparent 26%,transparent 68%,rgba(255,255,255,.07))}
#lyricspanel .qhead{padding:6px 30px 0;flex:none}
#lctl{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:12px 30px 0;flex:none}
#lctl:has(> #lofs[hidden]):has(> #lalt[hidden]){display:none}
#lctl #lofs{margin-left:auto}

function cylDepth() {

    // a long pause in the singing (instrumental, break, bridge) gets visible empty space before the next line
    if (lyr.synced && l.text) {
      const gap = prevSung ? l.t - prevSung.t : 0;
      if (gap > 9) { p.classList.add('gap'); p.style.marginTop = Math.min(6, 1.2 + (gap - 9) * .22).toFixed(2) + 'em'; }
      prevSung = l;
    }
    const txt = l.text || (lyr.synced ? '♪' : '');
    if (lyr.synced) txt.split(/\s+/).forEach((w, k) => { const s = document.createElement('span'); s.className = 'w'; s.style.setProperty('--i', k); s.textContent = w + ' '; p.appendChild(s); });
    else p.textContent = txt;
    if (lyr.synced) p.onclick = () => lyrSeek(l.t);
    lyrBox.appendChild(p);
  });
  applyVibe(textVibe || (lyr.synced ? tempoVibe(lyr.lines) : 'pop'));
  $('#lyrnote').textContent = lyr.vibe + (lyr.synced ? '' : ' · not synced'); updateOfs(); updateAlt();
  lyr.syncMin = Date.now() + 900;
  lyrSync(true);
}

async function loadLyrics() {
  const id = setArt.id;
  if (!id || lyr.id === id) return;
  lyr.id = id; lyr.ofs = getOfs(id); lyr.cands = []; lyr.ci = 0; const my = ++lyr.req; lyr.loading = true;
  const title = $('#title').textContent;
  const { t, a } = guessTrack(title, $('#by').textContent), vers = trackVersion(title);
  lyr.textVibe = vibeFromText(lyr.list) || vibeFromText(t + ' ' + a);
  applyVibe(lyr.textVibe || 'pop');
  $('#lyrnote').textContent = ''; updateAlt();
  lyrMsg('Searching for lyrics…');
  try {
    const dur = player && player.getDuration ? player.getDuration() : 0;
    const list = await findLyrics(t, a, vers, dur);
    if (my !== lyr.req) return;
    if (!list.length) return lyrMsg('No lyrics found for this song.');
    lyr.cands = list;
    const saved = readPicks()[id], at = saved ? list.findIndex(x => x.id === saved) : -1;   // a match you picked before wins
    lyr.ci = at >= 0 ? at : 0;
    renderLyrics(list[lyr.ci], lyr.textVibe);
  } catch (e) { if (my === lyr.req) { lyr.id = null; lyr.cands = []; updateAlt(); lyrMsg('Could not load lyrics.'); } }
  finally { if (my === lyr.req) lyr.loading = false; }
}

function lyrSync(force) {
  const onPanel = document.body.classList.contains('lyrics');
  document.body.classList.toggle('lload', !!(lyr.loading && onPanel));
  if (lyr.loading && onPanel) { document.body.classList.add('lsync'); return; }   // still looking for the lyrics
  if (!lyr.synced || !lyr.lines.length || !document.body.classList.contains('lyrics') || !player || !player.getCurrentTime) { document.body.classList.remove('lsync'); return; }
  let c = player.getCurrentTime();
  const st = player.getPlayerState ? player.getPlayerState() : 1;
  // After a skip, trust the target time until the player catches up
  if (lyr.seekTo != null) {
    if (Math.abs(c - lyr.seekTo) < 1.5 || Date.now() - lyr.seekAt > 3500) lyr.seekTo = null; else c = lyr.seekTo;
  }
  document.body.classList.toggle('lsync', lyr.seekTo != null || st === 3 || Date.now() < lyr.syncMin);
  c += .2 - (lyr.ofs || 0); let a = -1;
  for (let i = 0; i < lyr.lines.length; i++) { if (lyr.lines[i].t <= c) a = i; else break; }
  if (a === lyr.active && force !== true) return;
  const far = lyr.active >= 0 && Math.abs(a - lyr.active) > 2;
  lyr.active = a;
  const els = lyrBox.children;
  for (let i = 0; i < els.length; i++) { els[i].style.setProperty('--d', Math.min(4, Math.abs(i - a))); els[i].classList.toggle('on', i === a); }
  const el = els[Math.max(a, 0)];
  if (el && Date.now() > lyr.hold) lyrBox.scrollTo({ top: el.offsetTop - lyrBox.clientHeight / 2 + el.offsetHeight / 2, behavior: far ? 'auto' : 'smooth' });
}
function lyrSeek(t) {
  t = Math.max(0, t + (lyr.ofs || 0));
  player.seekTo(t, true);
  lyr.seekTo = t; lyr.seekAt = Date.now(); lyr.syncMin = Date.now() + 700; lyr.hold = 0;
  lyrSync(true);
}
setInterval(lyrSync, 200);
/* Scrolling the lyrics yourself pauses auto-follow; after 2.5 seconds without scrolling they snap back to the song */
let lyrScrollT = 0;
function lyrUserScrolled() {
  lyr.hold = Date.now() + 2500;
  clearTimeout(lyrScrollT);
  lyrScrollT = setTimeout(() => {
    lyr.hold = 0;
    if (!lyr.synced || !lyr.lines.length || !document.body.classList.contains('lyrics')) return;
    const el = lyrBox.children[Math.max(lyr.active, 0)];
    if (el) lyrBox.scrollTo({ top: el.offsetTop - lyrBox.clientHeight / 2 + el.offsetHeight / 2, behavior: 'smooth' });
  }, 2500);
}
['wheel', 'touchmove'].forEach(ev => lyrBox.addEventListener(ev, lyrUserScrolled, { passive: true }));

function toggleLyrics(on) {
  const b = document.body;
  on = on === undefined ? !b.classList.contains('lyrics') : on;
  b.classList.toggle('lyrics', on);
  $('#lyr').classList.toggle('on', on); $('#lyr').setAttribute('aria-pressed', on);
  $('#lyricspanel').setAttribute('aria-hidden', !on);
  if (on) { lyr.syncMin = Date.now() + 900; if (setArt.id) loadLyrics(); else lyrMsg('Play a song to see its lyrics.'); }
}
$('#lyr').onclick = () => toggleLyrics();
addEventListener('keydown', e => { if (e.key === 'Escape') toggleLyrics(false); });

/* Size the songs list to a whole number of rows so no song is ever cut in half */
function fitTracks() {
  const ul = $('#tracks'), li = ul.querySelector('li:not(.empty)');
  ul.style.flex = '1 1 0%'; ul.style.height = '';
  if (!li || !li.offsetHeight) return;
  const pad = parseFloat(getComputedStyle(ul).paddingTop) + parseFloat(getComputedStyle(ul).paddingBottom);
  const n = Math.max(1, Math.floor((ul.clientHeight - pad) / li.offsetHeight));
  ul.style.flex = '0 0 auto'; ul.style.height = n * li.offsetHeight + pad + 'px';
}
let fitRaf = 0;
const refit = () => { cancelAnimationFrame(fitRaf); fitRaf = requestAnimationFrame(fitTracks); };
if (window.ResizeObserver) { const ro = new ResizeObserver(refit); ro.observe($('#video')); ro.observe($('#songpanel')); }
addEventListener('resize', refit);

/* Remember the sign-in between visits (Google tokens last about an hour) */
(() => {
  const a = readAuth();
  if (!a) return;
  if (a.exp > Date.now()) { token = a.t; resetBtn(); showLists(); }
  else msg('Your sign-in expired. Press Connect account to sign back in.');
})();
</script>
